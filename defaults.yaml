  counter_db: ./data/signal_counter.sqlite3
ml:
  min_rows_for_walk_forward: 1000
  calibration_min_samples: 200
  retrain_max_rows: 5000
backtest:
  default_lookback_days: 90
positions:
  db_path: ./data/positions.sqlite3
checkpoint:
  path: ./data/checkpoint.json
news_guard:
  refresh_seconds: 120
  replay_db_path: ./data/news_guard_replay.sqlite3
  semantic_similarity_threshold: 0.72
  rss_sources:
    - name: sec_press
      url: https://www.sec.gov/news/pressreleases.rss
      source_type: regulator
    - name: coindesk
      url: https://www.coindesk.com/arc/outboundfeeds/rss/
      source_type: crypto_news
    - name: cointelegraph
      url: https://cointelegraph.com/rss
      source_type: crypto_news
    - name: bloomberg_crypto
      url: https://feeds.bloomberg.com/crypto/news.rss
      source_type: macro
    - name: the_block
      url: https://www.theblock.co/rss.xml
      source_type: crypto_news
  x_sources:
    - name: binance_status_x
      rss_url: https://nitter.net/binance/rss
    - name: okx_x
      rss_url: https://nitter.net/okx/rss
  telegram_sources:
    - name: binance_announcements
      channel: BinanceAnnouncements
    - name: hyperliquid_announcements
      channel: hyperliquidx
  whale_monitor:
    name: multi_chain_whales
    min_usd_notional: 1000000
    watched_addresses: []
