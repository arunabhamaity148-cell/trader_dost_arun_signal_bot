system:
  history_size: 3000
  min_snapshots_before_signals: 30
  signal_evaluation_interval_seconds: 1.0
  signal_evaluation_concurrency: 8
  market_queue_maxsize: 5000
watchlist:
  binance: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "AVAXUSDT", "LINKUSDT", "ARBUSDT"]
  bybit: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "AVAXUSDT", "LINKUSDT", "ARBUSDT"]
  okx: ["BTC-USDT-SWAP", "ETH-USDT-SWAP", "SOL-USDT-SWAP", "BNB-USDT-SWAP", "XRP-USDT-SWAP", "DOGE-USDT-SWAP", "ADA-USDT-SWAP", "AVAX-USDT-SWAP", "LINK-USDT-SWAP", "ARB-USDT-SWAP"]
  hyperliquid: ["BTC-PERP", "ETH-PERP", "SOL-PERP", "BNB-PERP", "XRP-PERP", "DOGE-PERP", "ADA-PERP", "AVAX-PERP", "LINK-PERP", "ARB-PERP"]
  deribit: ["BTC-PERPETUAL", "ETH-PERPETUAL"]
connectors:
  binance:
    open_interest_poll_seconds: 15
    reconnect_base_delay_seconds: 1.0
    reconnect_max_delay_seconds: 30.0
    reconnect_jitter_ratio: 0.2
    stable_connection_reset_seconds: 20
    recv_timeout_seconds: 30
    max_symbols_per_connection: 5
    # REST resilience: raised from the 10s/3-attempt defaults after production
    # logs showed frequent ConnectTimeout/ConnectError/gaierror on public
    # open-interest polling under normal (non-blocked) network conditions.
    # None of these calls use an API key - they are all public endpoints -
    # so the fix is longer timeouts/more retries, not credentials.
    http_timeout_seconds: 20.0
    http_max_attempts: 5
    http_max_connections: 6
    http_max_keepalive_connections: 3
    http_max_concurrency: 3
    http_retry_base_delay_seconds: 1.0
    http_retry_max_delay_seconds: 20.0
  bybit:
    reconnect_base_delay_seconds: 1.0
    reconnect_max_delay_seconds: 30.0
    reconnect_jitter_ratio: 0.2
    stable_connection_reset_seconds: 20
    recv_timeout_seconds: 30
    max_symbols_per_connection: 5
    http_timeout_seconds: 20.0
    http_max_attempts: 5
    http_max_connections: 6
    http_max_keepalive_connections: 3
    http_max_concurrency: 3
    http_retry_base_delay_seconds: 1.0
    http_retry_max_delay_seconds: 20.0
  okx:
    open_interest_poll_seconds: 15
    reconnect_base_delay_seconds: 1.0
    reconnect_max_delay_seconds: 30.0
    reconnect_jitter_ratio: 0.2
    stable_connection_reset_seconds: 20
    recv_timeout_seconds: 30
    max_symbols_per_connection: 5
    http_timeout_seconds: 20.0
    http_max_attempts: 5
    http_max_connections: 6
    http_max_keepalive_connections: 3
    http_max_concurrency: 3
    http_retry_base_delay_seconds: 1.0
    http_retry_max_delay_seconds: 20.0
  hyperliquid:
    open_interest_poll_seconds: 15
    reconnect_base_delay_seconds: 1.0
    reconnect_max_delay_seconds: 30.0
    reconnect_jitter_ratio: 0.2
    stable_connection_reset_seconds: 20
    recv_timeout_seconds: 30
    max_symbols_per_connection: 5
    http_timeout_seconds: 20.0
    http_max_attempts: 5
    http_max_connections: 6
    http_max_keepalive_connections: 3
    http_max_concurrency: 3
    http_retry_base_delay_seconds: 1.0
    http_retry_max_delay_seconds: 20.0
  deribit:
    options_poll_seconds: 30
    reconnect_base_delay_seconds: 1.0
    reconnect_max_delay_seconds: 30.0
    reconnect_jitter_ratio: 0.2
    stable_connection_reset_seconds: 20
    recv_timeout_seconds: 30
    max_symbols_per_connection: 20
    http_timeout_seconds: 20.0
    http_max_attempts: 5
    http_max_connections: 6
    http_max_keepalive_connections: 3
    http_max_concurrency: 3
    http_retry_base_delay_seconds: 1.0
    http_retry_max_delay_seconds: 20.0
external:
  refresh_seconds: 180
ops:
  health_alert_threshold: 60
  health_port: 8080
  health_refresh_seconds: 1.0
  suppression_log_cooldown_seconds: 60
  suppression_summary_window_seconds: 60
  runtime_summary_seconds: 60
risk:
  daily_loss_limit_r: 4
  kill_switch_after_consecutive_losses: 4
adaptive:
  kelly_cap: 0.03
  kelly_fraction: 0.5
  hmm_regimes: 3
  hmm_min_samples: 500
  hmm_refit_seconds: 300
  hmm_transition_confirmation_ticks: 3
  meta_label_threshold: 0.55
  max_gross_exposure: 0.1
  max_same_direction_exposure: 0.06
  prior_strength: 10
strategy_priors:
